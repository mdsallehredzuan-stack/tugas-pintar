<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tugas Pintar — pengurus tugasan harian."><title>Tugas Pintar Pro</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><div><span class="eyebrow">PRODUCTIVITY</span><h1>Tugas Pintar</h1><p>Urus tugasan anda dengan lebih teratur.</p></div><button id="theme" class="icon-btn" aria-label="Tukar tema">☾</button></header><section class="stats"><div><strong id="total">0</strong><span>Jumlah</span></div><div><strong id="active">0</strong><span>Belum siap</span></div><div><strong id="done">0</strong><span>Selesai</span></div><div><strong id="high">0</strong><span>Keutamaan</span></div></section><section class="panel"><form id="form"><input id="title" required maxlength="120" placeholder="Tambah tugasan baharu…"><select id="priority"><option value="low">Rendah</option><option value="medium" selected>Sederhana</option><option value="high">Tinggi</option></select><input id="due" type="date"><select id="category"><option>Peribadi</option><option>Kerja</option><option>Belajar</option><option>Lain-lain</option></select><button>Tambah</button></form><div class="controls"><input id="search" placeholder="Cari tugasan…"><div class="filters"><button data-filter="all" class="active">Semua</button><button data-filter="active">Belum siap</button><button data-filter="done">Selesai</button></div><button id="clear" class="danger">Padam selesai</button></div><div class="progress"><span id="progressText">0% selesai</span><div><i id="bar"></i></div></div><ul id="list"></ul><div id="empty" class="empty"><b>✓</b><h2>Tiada tugasan</h2><p>Tambah tugasan pertama anda.</p></div></section><footer>Disimpan secara automatik pada peranti anda.</footer></main><script src="app.js"></script></body></html>
